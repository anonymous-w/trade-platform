server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Refresh Docker DNS after the backend container is recreated.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $backend_origin http://backend:8080;
  client_max_body_size 16m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location /api/ {
    proxy_pass $backend_origin$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location /actuator/health { proxy_pass $backend_origin$request_uri; }
  # Revalidate the SPA entry so an already-open tab gets new assets on reload.
  location = /index.html { expires -1; }
  location / { try_files $uri $uri/ /index.html; }
}
